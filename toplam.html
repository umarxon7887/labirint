<script>
const $ = id => document.getElementById(id);

// ---------- Umumiy yordamchilar ----------
function makeRng(a) {               // seed bilan ishlaydigan tasodifiy son generatori (mulberry32)
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function wrapLines(ctx, text, maxW) {
  if (!text.trim()) return [];
  const out = [];
  text.split('\n').forEach(par => {
    if (!par.trim()) { out.push(''); return; }
    let line = '';
    par.trim().split(/\s+/).forEach(word => {
      const t = line ? line + ' ' + word : word;
      if (!line || ctx.measureText(t).width <= maxW) line = t;
      else { out.push(line); line = word; }
    });
    out.push(line);
  });
  return out;
}
const FONT = '"Trebuchet MS","DejaVu Sans",Arial,sans-serif';
const randInt = (rand, lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));

// ================= LABIRINT MODULI =================
const MZ = (function () {
  const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
  const HEROES = ['\u{1F9B8}','\u{1F9D2}','\u{1F467}','\u{1F431}','\u{1F436}','\u{1F430}','\u{1F98A}','\u{1F43B}','\u{1F43C}','\u{1F438}','\u{1F916}','\u{1F680}'];
  const GOALS  = ['\u{1F3C1}','\u{1F3E0}','\u{1F3F0}','\u{1F34E}','\u{1F36F}','\u{1F955}','\u{1F381}','\u2B50','\u{1F333}','\u{1F9B4}','\u{1F9C0}','\u{1F366}'];
  const SIZES = [[10,14],[20,28],[35,49],[60,85]];

  function regular(n, rot) { return Array.from({length:n}, (_, i) => { const t = rot + i*2*Math.PI/n; return [Math.cos(t), Math.sin(t)]; }); }
  function starPts() {
    const p = [];
    for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.42 : 1, t = -Math.PI/2 + i*Math.PI/5; p.push([r*Math.cos(t), r*Math.sin(t)]); }
    return p;
  }
  function heartPts() {
    const p = [];
    for (let i = 0; i < 72; i++) {
      const t = i*2*Math.PI/72;
      p.push([16*Math.pow(Math.sin(t),3), -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))]);
    }
    const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const sc = 2 / Math.max(maxX - minX, maxY - minY), cx = (minX+maxX)/2, cy = (minY+maxY)/2;
    return p.map(([x, y]) => [(x-cx)*sc, (y-cy)*sc]);
  }
  const SHAPES = {
    rect: null, circle: regular(48, 0), star: starPts(), heart: heartPts(),
    triangle: [[0,-1],[1,0.75],[-1,0.75]], diamond: [[0,-1],[1,0],[0,1],[-1,0]],
    house: [[0,-1],[1,-0.15],[0.72,-0.15],[0.72,0.9],[-0.72,0.9],[-0.72,-0.15],[-1,-0.15]], hexagon: regular(6, Math.PI/6)
  };
  function inPoly(x, y, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
    }
    return c;
  }
  function makeMask(W, H, shape) {
    const all = Array.from({length:H}, () => Array(W).fill(true));
    const poly = SHAPES[shape];
    if (!poly) return all;
    const m = Math.min(W, H) / 2;
    const inn = Array.from({length:H}, (_, y) => Array.from({length:W}, (_, x) => inPoly((x + 0.5 - W/2)/m, (y + 0.5 - H/2)/m, poly)));
    const comp = Array.from({length:H}, () => Array(W).fill(-1));
    let best = -1, bestSize = 0, id = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!inn[y][x] || comp[y][x] >= 0) continue;
      let size = 0; const q = [[x, y]]; comp[y][x] = id;
      for (let i = 0; i < q.length; i++) {
        const [cx, cy] = q[i]; size++;
        DIRS.forEach(([dx, dy]) => {
          const nx = cx+dx, ny = cy+dy;
          if (nx>=0 && ny>=0 && nx<W && ny<H && inn[ny][nx] && comp[ny][nx] < 0) { comp[ny][nx] = id; q.push([nx, ny]); }
        });
      }
      if (size > bestSize) { bestSize = size; best = id; }
      id++;
    }
    if (bestSize < 12) return all;
    return comp.map(row => row.map(c => c === best));
  }
  function build(W, H, seed, shape) {
    const rand = makeRng(seed);
    const inn = makeMask(W, H, shape);
    const isIn = (x, y) => x >= 0 && y >= 0 && x < W && y < H && inn[y][x];
    const cells = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (inn[y][x]) cells.push([x, y]);
    const open = Array.from({length:H}, () => Array.from({length:W}, () => [false,false,false,false]));
    const seen = Array.from({length:H}, () => Array(W).fill(false));
    const s0 = cells[Math.floor(rand()*cells.length)];
    const stack = [s0];
    seen[s0[1]][s0[0]] = true;
    while (stack.length) {
      const [x, y] = stack[stack.length-1];
      const nb = [];
      DIRS.forEach(([dx,dy], d) => { if (isIn(x+dx, y+dy) && !seen[y+dy][x+dx]) nb.push(d); });
      if (!nb.length) { stack.pop(); continue; }
      const d = nb[Math.floor(rand()*nb.length)];
      const nx = x+DIRS[d][0], ny = y+DIRS[d][1];
      open[y][x][d] = true; open[ny][nx][(d+2)%4] = true; seen[ny][nx] = true;
      stack.push([nx, ny]);
    }
    function bfs(fx, fy) {
      const dist = Array.from({length:H}, () => Array(W).fill(-1));
      const prev = {};
      dist[fy][fx] = 0;
      const q = [[fx, fy]];
      for (let i = 0; i < q.length; i++) {
        const [x, y] = q[i];
        DIRS.forEach(([dx,dy], d) => {
          if (!open[y][x][d]) return;
          const nx = x+dx, ny = y+dy;
          if (dist[ny][nx] < 0) { dist[ny][nx] = dist[y][x]+1; prev[nx+','+ny] = [x, y]; q.push([nx, ny]); }
        });
      }
      return { q, prev };
    }
    const isEdge = (x, y) => DIRS.some(([dx,dy]) => !isIn(x+dx, y+dy));
    const mx = cells.reduce((t, c) => t + c[0], 0) / cells.length;
    const my = cells.reduce((t, c) => t + c[1], 0) / cells.length;
    const dc = c => Math.hypot(c[0]-mx, c[1]-my);
    const edge = cells.filter(c => isEdge(c[0], c[1]));
    const maxD = Math.max(...edge.map(dc));
    const far = edge.filter(c => dc(c) >= 0.8*maxD);
    const a = far[Math.floor(rand()*far.length)];
    let e = null, bestD = -1;
    far.forEach(c => { const d = Math.hypot(c[0]-a[0], c[1]-a[1]); if (c !== a && d > bestD) { bestD = d; e = c; } });
    if (!e) e = edge.find(c => c !== a) || cells.find(c => c !== a);
    const b = bfs(a[0], a[1]);
    const outDir = c => {
      let best = 0, bs = -Infinity;
      for (let d = 0; d < 4; d++) {
        if (isIn(c[0]+DIRS[d][0], c[1]+DIRS[d][1])) continue;
        const sc = DIRS[d][0]*(c[0]-mx) + DIRS[d][1]*(c[1]-my);
        if (sc > bs) { bs = sc; best = d; }
      }
      return best;
    };
    const path = [];
    for (let c = e; c; c = b.prev[c[0]+','+c[1]]) path.push(c);
    path.reverse();
    let minX = W, maxX = 0, minY = H, maxY = 0;
    cells.forEach(([x, y]) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); });
    return { isIn, open, start:a, end:e, sDir:outDir(a), eDir:outDir(e), path, bbox:{minX, maxX, minY, maxY}, count:cells.length };
  }
  function drawMarker(ctx, emoji, cx, cy, size, k) {
    ctx.font = `${size*0.85*k}px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1f2a44';
    ctx.fillText(emoji, cx*k, cy*k);
  }
  const LBL = {
    uz: { defTitle: "Qahramonga uyiga yo'l topishga yordam ber!",
          shapes: {rect:"To'rtburchak", circle:"Doira", star:"Yulduz", heart:"Yurak", triangle:"Uchburchak", diamond:"Romb", house:"Uy", hexagon:"Oltiburchak"},
          foot: (n, W, H, sh) => `Labirint raqami: ${n} (${W}\u00d7${H}${sh ? ', ' + sh : ''})` },
    ru: { defTitle: "Помоги герою найти дорогу домой!",
          shapes: {rect:"Прямоугольник", circle:"Круг", star:"Звезда", heart:"Сердце", triangle:"Треугольник", diamond:"Ромб", house:"Домик", hexagon:"Шестиугольник"},
          foot: (n, W, H, sh) => `Лабиринт № ${n} (${W}\u00d7${H}${sh ? ', ' + sh : ''})` }
  };
  function draw(canvas, k, seed, level, showSolution, lang) {
    const pr = makeRng(seed*13 + 1);
    const shapeKeys = Object.keys(SHAPES);
    const shape = shapeKeys[Math.floor(pr()*shapeKeys.length)];
    const hero = HEROES[Math.floor(pr()*HEROES.length)];
    const goal = GOALS[Math.floor(pr()*GOALS.length)];
    const [W, H] = SIZES[level];
    const L = LBL[lang];
    const m = build(W, H, seed, shape);
    const ctx = canvas.getContext('2d');
    canvas.width = Math.round(210*k); canvas.height = Math.round(297*k);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const M = 14, areaW = 210 - 2*M;
    const fontPt = 24;
    const fpx = fontPt * 0.3528 * k;
    ctx.font = `700 ${fpx}px ${FONT}`;
    ctx.fillStyle = '#1f2a44'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const lines = wrapLines(ctx, L.defTitle, areaW*k);
    const lh = fpx * 1.25;
    lines.forEach((ln, i) => ctx.fillText(ln, 105*k, M*k + i*lh));
    const titleBottom = M + (lines.length * lh) / k;
    const footH = 7;
    ctx.font = `${8*0.3528*k}px ${FONT}`;
    ctx.fillStyle = '#7b869c'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(L.foot(seed, W, H, shape === 'rect' ? '' : L.shapes[shape]), (210-M)*k, (297-M)*k);
    const top = titleBottom + (lines.length ? 8 : 0);
    const areaH = (297 - M - footH) - top;
    const bb = m.bbox, gw = bb.maxX - bb.minX + 1, gh = bb.maxY - bb.minY + 1;
    const cell0 = Math.min(areaW / gw, areaH / gh);
    const S = Math.min(14, Math.max(9, cell0 * 0.95));
    const pad = [0, 0, 0, 0];
    pad[m.sDir] = S + 1; pad[m.eDir] = Math.max(pad[m.eDir], S + 1);
    const cell = Math.min((areaW - pad[1] - pad[3]) / gw, (areaH - pad[0] - pad[2]) / gh);
    const contentW = gw*cell + pad[1] + pad[3], contentH = gh*cell + pad[0] + pad[2];
    const ox = 105 - contentW/2 + pad[3] - bb.minX*cell;
    const oy = top + (areaH - contentH)/2 + pad[0] - bb.minY*cell;
    const gate = (x, y, d) => (x === m.start[0] && y === m.start[1] && d === m.sDir) || (x === m.end[0] && y === m.end[1] && d === m.eDir);
    ctx.strokeStyle = '#1f2a44';
    ctx.lineWidth = Math.min(0.9, Math.max(0.3, cell*0.09)) * k;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let y = bb.minY; y <= bb.maxY; y++) {
      for (let x = bb.minX; x <= bb.maxX; x++) {
        if (!m.isIn(x, y)) continue;
        const x0 = (ox + x*cell)*k, y0 = (oy + y*cell)*k, x1 = x0 + cell*k, y1 = y0 + cell*k;
        if ((!m.isIn(x, y-1) || !m.open[y][x][0]) && !gate(x, y, 0)) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); }
        if ((!m.isIn(x-1, y) || !m.open[y][x][3]) && !gate(x, y, 3)) { ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); }
        if (!m.isIn(x, y+1) && !gate(x, y, 2)) { ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); }
        if (!m.isIn(x+1, y) && !gate(x, y, 1)) { ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); }
      }
    }
    ctx.stroke();
    const ctr = ([x, y]) => [ox + (x+.5)*cell, oy + (y+.5)*cell];
    const outside = (c, d) => { const [cx, cy] = ctr(c), off = cell/2 + S/2 + 0.5; return [cx + DIRS[d][0]*off, cy + DIRS[d][1]*off]; };
    const sp = outside(m.start, m.sDir), ep = outside(m.end, m.eDir);
    if (showSolution) {
      ctx.strokeStyle = 'rgba(229,72,77,.85)';

}
const lvlMaze = buildLevelPicker('lvl-maze', 'pk_lvl_maze', 1);
const lvlSudoku = buildLevelPicker('lvl-sudoku', 'pk_lvl_sudoku', 1);
const lvlWords = buildLevelPicker('lvl-words', 'pk_lvl_words', 1);
const lvlCross = buildLevelPicker('lvl-cross', 'pk_lvl_cross', 1);

function fillSelect(sel, opts) {
  const cur = sel.value;
  sel.innerHTML = '';
  opts.forEach(([val, label]) => { const o = document.createElement('option'); o.value = val; o.textContent = label; sel.appendChild(o); });
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}
function refreshSelects() {
  fillSelect($('type-sudoku'), [['mixed', PT().mixed], ...SD.types.map(t => [t, SD.typeLabel[lang].types[t]])]);
  fillSelect($('cat-words'), [['mixed', PT().mixed], ...WS.cats.map(c => [c, WS.catLabel[lang].cats[c]])]);
}

function applyLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = PT()[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  document.title = PT().h1;
  try { localStorage.setItem('lang', l); } catch (e) {}
  [lvlMaze, lvlSudoku, lvlWords, lvlCross].forEach(p => p.rerender());
  refreshSelects();
  renderGrid();
}

function kindMod(kind) { return { maze: MZ, sudoku: SD, words: WS, cross: CW }[kind]; }
function kindLabel(kind) { return kindMod(kind).name[lang]; }

function drawItem(canvas, k, it, showSolution) {
  if (it.kind === 'maze') MZ.draw(canvas, k, it.seed, it.level, showSolution, lang);
  else if (it.kind === 'sudoku') SD.draw(canvas, k, it.seed, it.level, it.sub.type, showSolution, lang);
  else if (it.kind === 'words') WS.draw(canvas, k, it.seed, it.level, it.sub.cat, showSolution, lang);
  else CW.draw(canvas, k, it.seed, it.level, showSolution, lang);
}

function renderGrid() {
  const grid = $('grid'), wrap = $('reviewWrap');
  if (!items.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'grid';
  $('totalLbl').textContent = PT().totalLbl(items.length);
  grid.innerHTML = '';
  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'item';
    const canvas = document.createElement('canvas');
    card.appendChild(canvas);
    const lbl = document.createElement('div'); lbl.className = 'lbl';
    lbl.textContent = `${kindLabel(it.kind)} #${it.n}`;
    card.appendChild(lbl);
    const btns = document.createElement('div'); btns.className = 'btns';
    const regenBtn = document.createElement('button'); regenBtn.textContent = PT().regen;
    regenBtn.addEventListener('click', () => { it.seed = Math.floor(Math.random()*1e9) + 1; drawItem(canvas, 620/210, it, false); });
    const rmBtn = document.createElement('button'); rmBtn.textContent = PT().remove;
    rmBtn.addEventListener('click', () => { items = items.filter(x => x.id !== it.id); renderGrid(); });
    btns.appendChild(regenBtn); btns.appendChild(rmBtn);
    card.appendChild(btns);
    grid.appendChild(card);
    drawItem(canvas, 620/210, it, false);
  });
}

function buildPacket() {
  const specs = [
    { kind:'maze',   on:$('on-maze').checked,   cnt:$('cnt-maze'),   level:lvlMaze.get(),   sub:{} },
    { kind:'sudoku', on:$('on-sudoku').checked, cnt:$('cnt-sudoku'), level:lvlSudoku.get(), sub:{type:$('type-sudoku').value} },
    { kind:'words',  on:$('on-words').checked,  cnt:$('cnt-words'),  level:lvlWords.get(),  sub:{cat:$('cat-words').value} },
    { kind:'cross',  on:$('on-cross').checked,  cnt:$('cnt-cross'),  level:lvlCross.get(),  sub:{} }
  ];
  if (!specs.some(s => s.on && Math.max(0, +s.cnt.value || 0) > 0)) { alert(PT().nothingWarn); return; }
  items = [];
  specs.forEach(s => {
    if (!s.on) return;
    const n = Math.max(0, Math.min(20, Math.round(+s.cnt.value) || 0));
    for (let i = 1; i <= n; i++) items.push({ id: nextId++, kind: s.kind, n: i, level: s.level, sub: s.sub, seed: Math.floor(Math.random()*1e9) + 1 });
  });
  renderGrid();
  $('reviewWrap').scrollIntoView({ behavior:'smooth', block:'start' });
}

// ---------- Ko'p betli PDF ----------
function buildMultiPagePdf(pages) {
  const enc = new TextEncoder();
  const parts = []; const offsets = {};
  let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const PW = 595.28, PH = 841.89;
  const N = pages.length;
  push('%PDF-1.4\n');
  offsets[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  const kids = Array.from({length:N}, (_, i) => `${3+3*i} 0 R`).join(' ');
  offsets[2] = len; push(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${N} >>\nendobj\n`);
  pages.forEach((p, i) => {
    const pageNum = 3+3*i, imgNum = 4+3*i, contentNum = 5+3*i;
    const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    offsets[pageNum] = len; push(`${pageNum} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${imgNum} 0 R >> >> /Contents ${contentNum} 0 R >>\nendobj\n`);
    offsets[imgNum] = len; push(`${imgNum} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.buf.length} >>\nstream\n`);
    push(p.buf); push('\nendstream\nendobj\n');
    offsets[contentNum] = len; push(`${contentNum} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  });
  const xrefStart = len;
  const maxObj = 2 + 3*N;
  let xref = `xref\n0 ${maxObj+1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= maxObj; i++) xref += String(offsets[i] || 0).padStart(10, '0') + ' 00000 n \n';
  push(xref + `trailer\n<< /Size ${maxObj+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function exportPdf(showSolution) {
  if (!items.length) return;
  $('pdfTaskBtn').disabled = true; $('pdfAnsBtn').disabled = true;
  const status = $('status');
  const canvas = $('work');
  const k = 300/25.4;
  const pages = [];
  for (let i = 0; i < items.length; i++) {
    status.textContent = PT().statusPdf(i+1, items.length);
    await new Promise(r => setTimeout(r, 0));   // ekranni yangilash uchun imkon beradi
    drawItem(canvas, k, items[i], showSolution);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    const buf = new Uint8Array(await blob.arrayBuffer());
    pages.push({ buf, w: canvas.width, h: canvas.height });
  }
  const pdf = buildMultiPagePdf(pages);
  const stamp = Math.floor(Math.random()*1e6);
  download(pdf, showSolution ? `toplam-${stamp}-javoblar.pdf` : `toplam-${stamp}.pdf`);
  status.textContent = PT().statusDone;
  $('pdfTaskBtn').disabled = false; $('pdfAnsBtn').disabled = false;
  setTimeout(() => { status.textContent = ''; }, 2500);
}

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
$('buildBtn').addEventListener('click', buildPacket);
$('pdfTaskBtn').addEventListener('click', () => exportPdf(false));
$('pdfAnsBtn').addEventListener('click', () => exportPdf(true));

let savedLang = 'uz';
try { savedLang = localStorage.getItem('lang') || 'uz'; } catch (e) {}
applyLang(PAGE_I18N[savedLang] ? savedLang : 'uz');

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
