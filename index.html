<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labirint topshirig'i</title>
<meta name="description" content="Bolalar uchun labirint topshirig'i yaratuvchisi: qahramon va manzilni tanlang, PDF qilib yuklab oling. / Генератор лабиринтов для детей: выберите героя и цель, скачайте PDF.">

<meta property="og:description" content="Bolalar uchun bir zumda yangi labirint yarating va PDF qilib yuklab oling. / Создайте лабиринт и скачайте PDF.">

<style>
  :root { --ink:#1f2a44; --line:#c9d3e3; --bg:#e9eef5; --accent:#2f6fed; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Trebuchet MS", system-ui, sans-serif; }

  .controls { max-width:794px; margin:0 auto; padding:12px; display:grid; gap:10px; }
  .controls label { display:grid; gap:4px; font-size:14px; font-weight:600; }
  .controls textarea, .controls input[type=number], .controls input[type=file] {
    width:100%; font:inherit; font-weight:400; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); }
  .controls textarea { min-height:64px; resize:vertical; }
  .controls input[type=range] { width:100%; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .row.two { grid-template-columns:repeat(2,1fr); }
  .check { display:flex !important; align-items:center; gap:8px; font-weight:400 !important; }
  .buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { font:inherit; font-weight:700; padding:12px; border-radius:10px; border:2px solid var(--accent);
           background:#fff; color:var(--accent); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; grid-column:1 / -1; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #ffb703; outline-offset:2px; }

  .picker { display:grid; gap:6px; }
  .picker .lbl { font-size:14px; font-weight:600; }
  .stickers { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .stk { padding:0; height:48px; font-size:26px; line-height:1; border-radius:12px; border:2px solid var(--line); background:#fff; }
  .stk[aria-pressed=true] { border-color:var(--accent); background:#eaf1ff; }

  .lang { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .lang button { padding:8px; font-size:14px; }
  .lang button[aria-pressed=true] { background:var(--accent); color:#fff; }

  #sheet { display:block; width:min(100%,794px); height:auto; margin:4px auto 24px; background:#fff;
           box-shadow:0 2px 14px rgba(31,42,68,.18); }
  .note { text-align:center; font-size:13px; color:#5b6784; margin:-12px 12px 24px; }
</style>
</head>
<body>

<div class="controls">
  <div class="lang" role="group" aria-label="Til / Язык">
    <button type="button" data-lang="uz" aria-pressed="true">O'zbekcha</button>
    <button type="button" data-lang="ru" aria-pressed="false">Русский</button>
  </div>
  <label><span data-i18n="titleLabel"></span>
    <textarea id="title"></textarea>
  </label>
  <label><span><span data-i18n="fsLabel"></span> <span id="fsVal">28</span> pt</span>
    <input id="fs" type="range" min="14" max="48" value="28">
  </label>
  <div class="row">
    <label><span data-i18n="w"></span> <input id="w" type="number" min="5" max="30" value="10"></label>
    <label><span data-i18n="h"></span> <input id="h" type="number" min="5" max="30" value="14"></label>
    <label><span data-i18n="seedLabel"></span> <input id="seed" type="number" min="1" value="1"></label>
  </div>
  <div class="picker"><span class="lbl" data-i18n="heroPick"></span><div class="stickers" id="heroPick"></div></div>
  <div class="picker"><span class="lbl" data-i18n="goalPick"></span><div class="stickers" id="goalPick"></div></div>
  <label class="check"><input id="sol" type="checkbox"> <span data-i18n="sol"></span></label>
  <div class="buttons">
    <button id="newBtn" class="primary" data-i18n="newBtn"></button>
    <button id="pdfBtn" data-i18n="pdfBtn"></button>
    <button id="ansBtn" data-i18n="ansBtn"></button>
  </div>
</div>

<canvas id="sheet"></canvas>
<p class="note" data-i18n="note"></p>

<script>
const $ = id => document.getElementById(id);
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // shimol, sharq, janub, g'arb
const HEROES = ['🦸','🧒','👧','🐱','🐶','🐰','🦊','🐻','🐼','🐸','🤖','🚀'];
const GOALS  = ['🏁','🏠','🏰','🍎','🍯','🥕','🎁','⭐','🌳','🦴','🧀','🍦'];
let heroSt = HEROES[0], goalSt = GOALS[0];

// ---------- Tillar ----------
const I18N = {
  uz: {
    pageTitle: "Labirint topshirig'i",
    titleLabel: "Topshiriq matni (yuqorida chiqadi)", fsLabel: "Matn o'lchami:",
    w: "Eni", h: "Bo'yi", seedLabel: "Raqami",
    heroPick: "Qahramonni tanlang", goalPick: "Manzilni tanlang",
    sol: "Ekranda to'g'ri yo'lni ko'rsatish",
    newBtn: "Yangi labirint", pdfBtn: "Topshiriqni yuklab olish (PDF)", ansBtn: "Javob varag'ini yuklab olish (PDF)",
    note: "Ko'rib turganingiz PDF'da ham aynan shunday chiqadi.",
    defTitle: "Qahramonga uyiga yo'l topishga yordam ber!",
    foot: (n, W, H) => `Labirint raqami: ${n} (${W}×${H})`,
    file: n => `${n} raqamli labirint.pdf`,
    fileAns: n => `${n} raqamli labirint javobi.pdf`
  },
  ru: {
    pageTitle: "Задание-лабиринт",
    titleLabel: "Текст задания (сверху на листе)", fsLabel: "Размер текста:",
    w: "Ширина", h: "Высота", seedLabel: "Номер",
    heroPick: "Выберите героя", goalPick: "Выберите цель",
    sol: "Показать на экране правильный путь",
    newBtn: "Новый лабиринт", pdfBtn: "Скачать задание (PDF)", ansBtn: "Скачать лист с ответом (PDF)",
    note: "Именно так это будет выглядеть в PDF.",
    defTitle: "Помоги герою найти дорогу домой!",
    foot: (n, W, H) => `Лабиринт № ${n} (${W}×${H})`,
    file: n => `Лабиринт № ${n}.pdf`,
    fileAns: n => `Лабиринт № ${n} - ответ.pdf`
  }
};
let lang = 'uz';
const T = () => I18N[lang];

function applyLang(l, initial) {
  const defaults = Object.values(I18N).map(x => x.defTitle);
  const cur = $('title').value.trim();
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  // Matn hali o'zgartirilmagan bo'lsa (standart matn), yangi tilga o'tkazamiz
  if (defaults.includes(cur) || (initial && !cur)) $('title').value = T().defTitle;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  document.title = T().pageTitle;
  try { localStorage.setItem('lang', l); } catch (e) {}
  render();
}

// ---------- Labirint algoritmi ----------
function makeRng(a) {               // seed bilan ishlaydigan tasodifiy son generatori (mulberry32)
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function build(W, H, seed) {
  const rand = makeRng(seed);
  const open = Array.from({length:H}, () => Array.from({length:W}, () => [false,false,false,false]));
  const seen = Array.from({length:H}, () => Array(W).fill(false));

  // Recursive Backtracker (DFS, stek bilan)
  const sx = Math.floor(rand()*W), sy = Math.floor(rand()*H);
  const stack = [[sx, sy]];
  seen[sy][sx] = true;
  while (stack.length) {
    const [x, y] = stack[stack.length-1];
    const nb = [];
    DIRS.forEach(([dx,dy], d) => {
      const nx = x+dx, ny = y+dy;
      if (nx>=0 && ny>=0 && nx<W && ny<H && !seen[ny][nx]) nb.push(d);
    });
    if (!nb.length) { stack.pop(); continue; }
    const d = nb[Math.floor(rand()*nb.length)];
    const nx = x+DIRS[d][0], ny = y+DIRS[d][1];
    open[y][x][d] = true;
    open[ny][nx][(d+2)%4] = true;
    seen[ny][nx] = true;
    stack.push([nx, ny]);
  }

  // BFS: berilgan katakdan eng uzoq katak va yo'l
  function bfs(fx, fy) {
    const dist = Array.from({length:H}, () => Array(W).fill(-1));
    const prev = {};
    dist[fy][fx] = 0;
    const q = [[fx, fy]];
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      DIRS.forEach(([dx,dy], d) => {
        if (!open[y][x][d]) return;
        const nx = x+dx, ny = y+dy;
        if (dist[ny][nx] < 0) {
          dist[ny][nx] = dist[y][x]+1;
          prev[nx+','+ny] = [x, y];
          q.push([nx, ny]);
        }
      });
    }
    return { last:q[q.length-1], prev };
  }

  // Boshi va oxiri: eng uzun yo'l bo'ladigan ikki chekka katak
  const a = bfs(Math.floor(rand()*W), Math.floor(rand()*H)).last;
  const b = bfs(a[0], a[1]);
  const start = a, end = b.last;
  const path = [];
  for (let c = end; c; c = b.prev[c[0]+','+c[1]]) path.push(c);
  path.reverse();                    // boshidan oxirigacha
  return { open, start, end, path };
}

// ---------- Varaqni chizish (A4 = 210 x 297 mm, k = piksel/mm) ----------
function state() {
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v || lo));
  return {
    W: clamp(Math.round(+$('w').value), 5, 30),
    H: clamp(Math.round(+$('h').value), 5, 30),
    seed: Math.max(1, Math.round(+$('seed').value) || 1),
    title: $('title').value,
    fontPt: +$('fs').value || 28
  };
}

function wrapLines(ctx, text, maxW) {
  if (!text.trim()) return [];
  const out = [];
  text.split('\n').forEach(par => {
    if (!par.trim()) { out.push(''); return; }
    let line = '';
    par.trim().split(/\s+/).forEach(word => {
      const t = line ? line + ' ' + word : word;
      if (!line || ctx.measureText(t).width <= maxW) line = t;
      else { out.push(line); line = word; }
    });
    out.push(line);
  });
  return out;
}

function drawMarker(ctx, emoji, cx, cy, size, k) {
  ctx.font = `${size*0.8*k}px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1f2a44';
  ctx.fillText(emoji, cx*k, cy*k);
}

function drawSheet(canvas, k, showSolution) {
  const s = state();
  const m = build(s.W, s.H, s.seed);
  const ctx = canvas.getContext('2d');
  canvas.width = Math.round(210*k);
  canvas.height = Math.round(297*k);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const M = 14;                                   // chetdan bo'sh joy, mm
  const areaW = 210 - 2*M;

  // Sarlavha matni
  const fpx = s.fontPt * 0.3528 * k;              // pt -> mm -> px
  ctx.font = `700 ${fpx}px "Trebuchet MS","DejaVu Sans",Arial,sans-serif`;
  ctx.fillStyle = '#1f2a44';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const lines = wrapLines(ctx, s.title, areaW*k);
  const lh = fpx * 1.25;
  lines.forEach((ln, i) => ctx.fillText(ln, 105*k, M*k + i*lh));
  const titleBottom = M + (lines.length * lh) / k;

  // Pastki yozuv
  const footH = 7;
  ctx.font = `${8*0.3528*k}px "Trebuchet MS","DejaVu Sans",Arial,sans-serif`;
  ctx.fillStyle = '#7b869c'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(T().foot(s.seed, s.W, s.H), (210-M)*k, (297-M)*k);

  // Labirint joylashadigan maydon
  const top = titleBottom + (lines.length ? 8 : 0);
  const areaH = (297 - M - footH) - top;
  const cell = Math.min(areaW / s.W, areaH / s.H);
  const ox = 105 - (cell*s.W)/2;
  const oy = top + (areaH - cell*s.H)/2;

  // Devorlar
  ctx.strokeStyle = '#1f2a44';
  ctx.lineWidth = Math.min(0.9, Math.max(0.35, cell*0.09)) * k;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let y = 0; y < s.H; y++) {
    for (let x = 0; x < s.W; x++) {
      const x0 = (ox + x*cell)*k, y0 = (oy + y*cell)*k, x1 = x0 + cell*k, y1 = y0 + cell*k;
      if (!m.open[y][x][0]) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); }
      if (!m.open[y][x][3]) { ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); }
      if (y === s.H-1)      { ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); }
      if (x === s.W-1)      { ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); }
    }
  }
  ctx.stroke();

  // To'g'ri yo'l (javob varag'i)
  if (showSolution) {
    ctx.strokeStyle = 'rgba(229,72,77,.85)';
    ctx.lineWidth = cell * 0.22 * k;
    ctx.beginPath();
    m.path.forEach(([x, y], i) => {
      const px = (ox + (x+.5)*cell)*k, py = (oy + (y+.5)*cell)*k;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.stroke();
  }

  // Qahramon va manzil
  drawMarker(ctx, heroSt, ox + (m.start[0]+.5)*cell, oy + (m.start[1]+.5)*cell, cell, k);
  drawMarker(ctx, goalSt, ox + (m.end[0]+.5)*cell,   oy + (m.end[1]+.5)*cell,   cell, k);
}

function render() {
  $('fsVal').textContent = $('fs').value;
  drawSheet($('sheet'), 1240/210, $('sol').checked);   // ekran uchun (~150 dpi)
}

// ---------- PDF (bitta A4 sahifa, JPEG rasm) ----------
function makePdf(jpeg, imgW, imgH) {
  const enc = new TextEncoder();
  const parts = [], offsets = [];
  let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const PW = 595.28, PH = 841.89;               // A4, pt
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;

  push('%PDF-1.4\n');
  offsets[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offsets[3] = len; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  offsets[4] = len;
  push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg); push('\nendstream\nendobj\n');
  offsets[5] = len; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xref = len;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function savePdf(withSolution) {
  const seed = state().seed;
  const c = document.createElement('canvas');
  drawSheet(c, 300/25.4, withSolution);           // bosma uchun 300 dpi
  c.toBlob(async blob => {
    const jpeg = new Uint8Array(await blob.arrayBuffer());
    const pdf = makePdf(jpeg, c.width, c.height);
    download(pdf, withSolution ? T().fileAns(seed) : T().file(seed));
  }, 'image/jpeg', 0.93);
}

// ---------- Boshqaruv ----------
function buildPicker(boxId, list, get, set, storeKey) {
  const box = $(boxId);
  box.innerHTML = '';
  list.forEach(em => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'stk'; b.textContent = em; b.setAttribute('aria-label', em);
    b.setAttribute('aria-pressed', String(get() === em));
    b.addEventListener('click', () => {
      set(em);
      box.querySelectorAll('.stk').forEach(x => x.setAttribute('aria-pressed', String(x.textContent === em)));
      try { localStorage.setItem(storeKey, em); } catch (e) {}
      render();
    });
    box.appendChild(b);
  });
}
try {
  const h = localStorage.getItem('hero'), g = localStorage.getItem('goal');
  if (HEROES.includes(h)) heroSt = h;
  if (GOALS.includes(g)) goalSt = g;
} catch (e) {}
buildPicker('heroPick', HEROES, () => heroSt, v => heroSt = v, 'hero');
buildPicker('goalPick', GOALS,  () => goalSt, v => goalSt = v, 'goal');
['title','fs','w','h','seed','sol'].forEach(id => $(id).addEventListener('input', render));
$('newBtn').addEventListener('click', () => {
  $('seed').value = Math.floor(Math.random()*1e9) + 1;
  render();
});
$('pdfBtn').addEventListener('click', () => savePdf(false));
$('ansBtn').addEventListener('click', () => savePdf(true));

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

$('seed').value = Math.floor(Math.random()*1e9) + 1;
let saved = 'uz';
try { saved = localStorage.getItem('lang') || 'uz'; } catch (e) {}
applyLang(I18N[saved] ? saved : 'uz', true);

// Oflayn ishlash va telefonga o'rnatish (PWA)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
